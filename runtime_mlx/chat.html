<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>lamq chat</title>
<style>
  :root {
    color-scheme: light dark;
    --paper: #f7f9fd;
    --field: #fff;
    --wash: #e8eef6;
    --code: #f0f4fa;
    --ink: #1b2636;
    --muted: #4e5e75;
    --line: #d4deeb;
    --edge: #7c90ad;
    --focus: #3c6495;
    --action: #4c6c97;
    --action-hover: #3b5c87;
    --on-action: #fff;
    --idle: #e1e8f1;
    --idle-ink: #536681;
    --warn: #823e27;
    --warn-wash: #f8efea;
    --warn-edge: #a57059;
    --shade: 0 2px 4px #21395c09, 0 8px 26px #21395c12;
    --mist: #a9bfdc27;
    --column: 704px;
    --gutter: clamp(12px, 3.4vw, 48px);
    --tap: 32px;
    --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #151e2a;
      --field: #111923;
      --wash: #263345;
      --code: #1a2533;
      --ink: #e9eff8;
      --muted: #aebed2;
      --line: #354357;
      --edge: #667a95;
      --focus: #a6c7ed;
      --action: #b5cce7;
      --action-hover: #c9ddf2;
      --on-action: #172232;
      --idle: #293649;
      --idle-ink: #a2b3c8;
      --warn: #f3bba4;
      --warn-wash: #312825;
      --warn-edge: #ad806d;
      --shade: 0 4px 24px #9ebdee0b;
      --mist: #7194c51c;
    }
  }
  @media (max-width: 600px), (pointer: coarse) {
    :root { --tap: 44px; }
  }
  @media (prefers-contrast: more) {
    :root { --edge: var(--ink); --line: var(--muted); --muted: var(--ink); --shade: none; --mist: transparent; }
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    display: grid;
    grid-template: auto auto minmax(0, 1fr) auto / minmax(0, 1fr);
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.5 var(--sans);
  }
  button, input, select, summary, textarea { font: inherit; color: inherit; }
  button, summary { cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  button, summary { border-radius: 7px; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .column { width: min(100%, var(--column)); margin-inline: auto; }
  body > :is(header, main, section, form) { grid-column: 1; }
  .topbar {
    grid-row: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 47px;
    padding: 2px var(--gutter);
  }
  .topbar::after {
    position: absolute;
    content: "";
    inset: auto 0 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line) 12%, var(--line) 88%, transparent);
    pointer-events: none;
  }
  h1 { margin: 0; font-size: 15px; line-height: 1; font-weight: 660; letter-spacing: -.025em; }
  .header-tools { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
  .quiet, .turn-action, .msg .action, .code-copy {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: var(--tap);
    padding: 0 8px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.2;
    font-weight: 550;
  }
  .icon { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  @media (hover: hover) {
    :is(.quiet, .turn-action, .msg .action, .code-copy):enabled:hover, summary:hover { background: var(--wash); color: var(--ink); }
    :is(.round, #reconnect):enabled:hover { background: var(--action-hover); }
  }
  #gate {
    grid-row: 2;
    padding: 18px var(--gutter) 0;
    max-height: 42dvh;
    overflow-y: auto;
    z-index: 1;
  }
  body:has(#msgs:empty) #gate {
    grid-row: 3;
    align-self: center;
    padding-block: 12px;
  }
  .gate-inner {
    padding: 13px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--field);
    box-shadow: var(--shade);
  }
  body:has(#msgs:empty) .gate-inner { max-width: 420px; padding: 17px 18px; }
  #gateMessage { margin: 0; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
  .gate-controls { display: flex; flex-wrap: wrap; gap: 9px; align-items: flex-end; margin-top: 12px; }
  .gate-controls:not(:has(> :not([hidden]))) { display: none; }
  #keyLabel { display: grid; flex: 1 1 145px; gap: 4px; min-width: 0; }
  #key, #effort, #maxTokens {
    width: 100%;
    min-width: 0;
    min-height: var(--tap);
    padding: 5px 8px;
    border: 1px solid var(--edge);
    border-radius: 6px;
    background: var(--field);
  }
  #keyLabel, .setting-label { color: var(--muted); font-size: 13px; font-weight: 550; }
  #key, #effort, #maxTokens { color: var(--ink); font-weight: 400; }
  #reconnect {
    min-height: var(--tap);
    padding: 0 12px;
    border: 1px solid transparent;
    background: var(--action);
    color: var(--on-action);
    font-size: 13px;
    font-weight: 600;
  }
  #reconnect[aria-disabled="true"] { background: var(--idle); color: var(--idle-ink); cursor: default; }
  #log {
    grid-row: 3;
    min-width: 0;
    overflow: auto;
    overflow-anchor: none;
    overscroll-behavior-y: contain;
    scrollbar-width: thin;
    padding-inline: var(--gutter);
  }
  #log:focus-visible { outline-offset: -3px; }
  #msgs {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: clamp(20px, 4vh, 34px);
    padding-block: clamp(21px, 4.8vh, 44px) 20px;
  }
  #msgs:empty { padding: 0; }
  .msg { min-width: 0; max-width: 100%; scroll-margin-block: 14px; overflow-wrap: anywhere; }
  .user {
    justify-self: end;
    max-width: min(91%, 570px);
    padding: 10px 15px;
    border-radius: 13px 13px 4px 13px;
    background: var(--wash);
    white-space: pre-wrap;
  }
  .assistant { font-size: 16px; line-height: 1.62; }
  .assistant .body:not(.rich-reply) { white-space: pre-wrap; }
  .rich-reply > :first-child { margin-top: 0; }
  .rich-reply > :last-child { margin-bottom: 0; }
  .rich-reply p { margin: 0 0 .8em; white-space: pre-line; }
  .rich-reply :is(h2, h3, h4, h5, h6) {
    margin: 1.35em 0 .42em;
    line-height: 1.3;
    font-weight: 650;
    letter-spacing: -.018em;
  }
  .rich-reply h2 { font-size: 1.28em; }
  .rich-reply h3 { font-size: 1.12em; }
  .rich-reply :is(h4, h5, h6) { font-size: 1em; }
  .rich-reply :is(ol, ul) { margin: .45em 0 .9em; padding-inline-start: 1.5em; }
  .rich-reply :is(ol, ul) :is(ol, ul) { margin: .3em 0 .4em; }
  .rich-reply li { margin-block: .22em; padding-inline-start: .18em; white-space: pre-line; }
  .rich-reply hr { border: 0; border-top: 1px solid var(--line); margin: 1.3em 0; }
  .rich-reply code, .rich-reply pre { font-family: var(--mono); }
  .rich-reply :not(pre) > code {
    padding: .08em .28em;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--code);
    font-size: .88em;
    white-space: break-spaces;
  }
  .code-block {
    min-width: 0;
    margin: .9em 0 1.05em;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--code);
  }
  .code-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 2px 5px 2px 12px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font: 550 12px/1.3 var(--sans);
  }
  .code-copy { min-width: 66px; }
  .code-block pre { margin: 0; padding: 11px 13px 13px; overflow: auto; font-size: 13px; line-height: 1.55; }
  .assistant details { color: var(--muted); font-size: 13px; line-height: 1.45; }
  .assistant details > summary { width: fit-content; min-height: var(--tap); padding: 6px 7px; margin-inline-start: -7px; }
  .think:not([hidden]) { margin-bottom: 4px; }
  .stats:not([hidden]) { margin-top: 6px; font-variant-numeric: tabular-nums; }
  .reasoning-text, .stats-value {
    margin: 2px 0 8px;
    padding: 2px 11px 2px 12px;
    border-inline-start: 2px solid var(--line);
    white-space: pre-wrap;
  }
  .notice {
    max-width: 100%;
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 7px;
    background: var(--code);
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
  }
  .notice:empty { display: none; }
  .streaming .notice { padding: 0; background: transparent; }
  .msg.error .notice, .msg.partial .notice { color: var(--warn); background: var(--warn-wash); }
  :is(.msg, #sendError) :is(.turn-action, .action) { margin: 5px 5px 0 0; border-color: var(--edge); color: var(--ink); }
  #form {
    grid-row: 4;
    min-width: 0;
    padding: 8px var(--gutter) max(18px, env(safe-area-inset-bottom));
    background: radial-gradient(ellipse at 50% 100%, var(--mist), transparent 67%);
  }
  .composer {
    position: relative;
    padding: 9px 9px 7px 12px;
    border: 1px solid var(--edge);
    border-radius: 12px;
    background: var(--field);
    box-shadow: var(--shade);
  }
  .composer:focus-within { border-color: var(--focus); }
  .composer:has(textarea:focus-visible) { outline: 2px solid var(--focus); outline-offset: -1px; }
  #input {
    display: block;
    width: 100%;
    min-height: 27px;
    max-height: min(9em, 30dvh);
    field-sizing: content;
    resize: none;
    padding: 2px 2px 0 0;
    border: 0;
    outline: 0;
    background: transparent;
    font-size: 16px;
    line-height: 1.45;
  }
  #input::placeholder, #maxTokens::placeholder { color: var(--muted); opacity: 1; }
  #input:disabled { color: var(--muted); }
  .composer-tools {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto minmax(0, auto) auto;
    align-items: center;
    gap: 3px 6px;
    margin-top: 4px;
  }
  #settings { grid-column: 1; min-width: 0; color: var(--muted); font-size: 12px; }
  #settings[open] { grid-column: 1 / -1; }
  #settings summary {
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: var(--tap);
    width: fit-content;
    margin-inline-start: -4px;
    padding: 0 4px;
    list-style: none;
    font-weight: 550;
  }
  #settings summary::-webkit-details-marker { display: none; }
  .chevron { width: 12px; height: 12px; }
  #settings[open] .chevron { transform: rotate(180deg); }
  .settings-panel {
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    align-items: start;
    gap: 7px 12px;
    max-width: 440px;
    padding: 4px 0 9px;
  }
  .setting-label { display: grid; gap: 4px; }
  #contextInfo { grid-column: 1 / -1; margin: 0; overflow-wrap: anywhere; }
  #contextInfo:empty { display: none; }
  #keyboardHint { grid-column: 2; color: var(--muted); font-size: 11px; white-space: nowrap; }
  #readReply { grid-column: 3; padding: 0 4px; white-space: nowrap; }
  #status {
    grid-column: 4;
    min-width: 0;
    max-width: 235px;
    overflow: hidden;
    color: var(--muted);
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
  }
  #status:empty { display: none; }
  .round {
    grid-column: 5;
    display: grid;
    align-items: center;
    justify-items: center;
    width: var(--tap);
    height: var(--tap);
    margin-left: 2px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 50%;
    background: var(--action);
    color: var(--on-action);
  }
  .round:disabled { background: var(--idle); color: var(--idle-ink); }
  .round .icon { width: 17px; height: 17px; }
  #stop-mark { fill: currentColor; stroke: none; }
  #budgetError, #sendError {
    margin: 4px 0 0;
    color: var(--warn);
    font-size: 12px;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }
  [aria-invalid="true"] { border-color: var(--warn-edge) !important; }
  @media (max-width: 630px), (pointer: coarse) {
    #keyboardHint { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); }
  }
  @media (max-width: 480px) {
    #form { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    #key, #maxTokens, #effort { font-size: 16px; }
    .composer-tools { gap: 2px 4px; }
    .user { max-width: 94%; }
    #readReply { padding-inline: 3px; }
  }
  @media (max-height: 480px) {
    #gate { max-height: min(58dvh, 200px); }
    body:has(#msgs:empty) #gate { grid-row: 2; align-self: start; padding-block: 8px 0; }
  }
  @media (forced-colors: active) {
    .topbar { border-bottom: 1px solid CanvasText; }
    .user, .notice, .round, #reconnect, .code-copy, .code-block, .gate-inner { border: 1px solid CanvasText; }
    .round:disabled { border-color: GrayText; }
    .composer:focus-within, :focus-visible { outline-color: Highlight; }
  }
</style>
</head>
<body>
<section id="gate" aria-label="Connection">
  <div class="column gate-inner">
    <p id="gateMessage">Connecting to the model…</p>
    <div class="gate-controls">
      <label id="keyLabel" for="key" hidden>
        API key
        <input id="key" type="password" autocomplete="off" spellcheck="false">
      </label>
      <button id="reconnect" type="button" hidden>Reconnect</button>
    </div>
  </div>
</section>
<main id="log" aria-label="Conversation" tabindex="-1">
  <div id="empty" hidden></div>
  <div class="column" id="msgs"></div>
</main>
<form id="form" novalidate>
  <div class="column composer">
    <label class="sr-only" for="input">Message</label>
    <textarea id="input" rows="1" placeholder="Message…" aria-describedby="keyboardHint" autocomplete="off"></textarea>
    <p id="sendError" hidden></p>
    <div class="composer-tools">
      <details id="settings">
        <summary>
          Settings
          <svg class="icon chevron" aria-hidden="true" viewBox="0 0 16 16"><path d="m4.5 6 3.5 3.5L11.5 6"/></svg>
        </summary>
        <div class="settings-panel">
          <label class="setting-label" for="effort">
            Reasoning
            <select id="effort">
              <option value="">Server default</option>
              <option value="none">None</option>
              <option value="minimal">Minimal</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="xhigh">Extra high</option>
              <option value="max">Maximum</option>
            </select>
          </label>
          <div>
            <label class="setting-label" for="maxTokens">
              Max tokens
              <input id="maxTokens" type="number" min="1" step="1" placeholder="Default" aria-describedby="budgetError">
            </label>
            <p id="budgetError" hidden></p>
          </div>
          <p id="contextInfo"></p>
        </div>
      </details>
      <span id="keyboardHint">Enter to send · Shift+Enter for a new line</span>
      <button id="readReply" type="button" class="quiet" hidden>Latest reply</button>
      <span id="status"></span>
      <button id="send" type="submit" class="round" aria-label="Send" title="Send" disabled>
        <svg class="icon" aria-hidden="true" viewBox="0 0 20 20"><path d="M10 15V5m-4 4 4-4 4 4"/></svg>
      </button>
      <button id="stop" type="button" class="round" aria-label="Stop" title="Stop" hidden>
        <svg class="icon" aria-hidden="true" viewBox="0 0 20 20"><rect id="stop-mark" x="5.5" y="5.5" width="9" height="9" rx="1.4"/></svg>
      </button>
    </div>
  </div>
</form>
<header class="topbar">
  <h1>lamq</h1>
  <div class="header-tools">
    <button id="undo" type="button" class="quiet" hidden>Undo</button>
    <button id="clear" type="button" class="quiet">
      <svg class="icon" aria-hidden="true" viewBox="0 0 16 16"><path d="M7 2.75H4a1.25 1.25 0 0 0-1.25 1.25v8A1.25 1.25 0 0 0 4 13.25h8A1.25 1.25 0 0 0 13.25 12V9m-1.2-6.7 1.65 1.65-5.25 5.25-2.1.45.45-2.1z"/></svg>
      New chat
    </button>
  </div>
</header>
<div id="announcer" role="status" aria-live="polite" aria-atomic="true" class="sr-only"></div>
<script>
"use strict";

// Render the reply syntax used by the model. All model text is inserted as text nodes.
function appendReplyInline(parent, text, bold = true) {
  const tokens = bold
    ? /\\([\\`*_])|(`+)([^\n]+?)\2(?!`)|\*\*(\S(?:[^\n]*?\S)?)\*\*|__(\S(?:[^\n]*?\S)?)__/g
    : /\\([\\`*_])|(`+)([^\n]+?)\2(?!`)/g;
  let start = 0;
  for (const match of text.matchAll(tokens)) {
    parent.append(text.slice(start, match.index));
    if (match[1]) {
      parent.append(match[1]);
    } else if (match[2]) {
      const code = document.createElement("code");
      const inline = match[3];
      code.textContent = inline.startsWith(" ") && inline.endsWith(" ") && inline.trim() ? inline.slice(1, -1) : inline;
      parent.append(code);
    } else {
      const strong = document.createElement("strong");
      appendReplyInline(strong, match[4] ?? match[5], false);
      parent.append(strong);
    }
    start = match.index + match[0].length;
  }
  parent.append(text.slice(start));
}

async function copyReplyCode(code) {
  if (navigator.clipboard?.writeText) {
    try {
      await navigator.clipboard.writeText(code.textContent);
      return "copied";
    } catch { /* Try the browser’s selection-based copy command. */ }
  }
  const selection = document.getSelection();
  if (!selection) return "unavailable";
  const original = Array.from({ length: selection.rangeCount }, (_, i) => selection.getRangeAt(i));
  const range = document.createRange();
  range.selectNodeContents(code);
  selection.removeAllRanges();
  selection.addRange(range);
  try {
    if (document.execCommand("copy")) {
      selection.removeAllRanges();
      for (const originalRange of original) selection.addRange(originalRange);
      return "copied";
    }
  } catch { /* Leave the code selected for a manual copy. */ }
  return "selected";
}

function replyCodeBlock(language, text) {
  const figure = document.createElement("figure");
  const header = document.createElement("figcaption");
  const label = document.createElement("span");
  const button = document.createElement("button");
  const pre = document.createElement("pre");
  const code = document.createElement("code");
  figure.className = "code-block";
  header.className = "code-head";
  label.textContent = language || "Code";
  button.className = "code-copy";
  button.type = "button";
  button.textContent = "Copy";
  button.setAttribute("aria-label", "Copy code");
  pre.tabIndex = 0;
  pre.setAttribute("aria-label", "Code sample");
  code.textContent = text;
  pre.append(code);
  header.append(label, button);
  figure.append(header, pre);

  let reset;
  button.addEventListener("click", async () => {
    const result = await copyReplyCode(code);
    clearTimeout(reset);
    const feedback = {
      copied: ["Copied", "Code copied."],
      selected: ["Selected", "Code selected. Use your browser’s Copy command."],
      unavailable: ["Copy failed", "Could not copy the code."],
    };
    const [label, announcement] = feedback[result];
    button.textContent = label;
    document.getElementById("announcer").textContent = announcement;
    reset = setTimeout(() => { button.textContent = "Copy"; }, 2200);
  });
  return figure;
}

function renderReply(body, text) {
  const content = document.createDocumentFragment();
  const lines = text.split(/\r\n?|\n/);
  const lists = [];
  const paragraph = [];
  function flushParagraph() {
    if (!paragraph.length) return;
    const element = document.createElement("p");
    appendReplyInline(element, paragraph.join("\n"));
    content.append(element);
    paragraph.length = 0;
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!line.trim()) {
      flushParagraph();
      continue;
    }
    const fence = line.match(/^ {0,3}(`{3,}|~{3,})[ \t]*(\S*)/);
    const heading = line.match(/^ {0,3}(#{1,6})[ \t]+(.+)$/);
    const divider = /^ {0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line);
    if (fence || heading || divider) {
      flushParagraph();
      lists.length = 0;
      if (fence) {
        const code = [];
        const end = new RegExp("^ {0,3}" + fence[1][0] + "{" + fence[1].length + ",}\\s*$");
        while (++i < lines.length && !end.test(lines[i])) code.push(lines[i]);
        if (i === lines.length && code.at(-1) === "") code.pop();
        content.append(replyCodeBlock(fence[2].slice(0, 36), code.join("\n")));
      } else if (heading) {
        const element = document.createElement("h" + Math.min(6, heading[1].length + 1));
        appendReplyInline(element, heading[2].replace(/\s+#+\s*$/, ""));
        content.append(element);
      } else {
        content.append(document.createElement("hr"));
      }
      continue;
    }

    const item = line.match(/^([ \t]*)([-+*]|\d{1,9}[.)])[ \t]+(.*)$/);
    if (item) {
      flushParagraph();
      const indent = item[1].replaceAll("\t", "    ").length;
      const tag = /^\d/.test(item[2]) ? "ol" : "ul";
      while (lists.length && lists.at(-1).indent > indent) lists.pop();
      if (lists.at(-1)?.indent === indent && lists.at(-1).list.localName !== tag) lists.pop();
      if (lists.at(-1)?.indent !== indent) {
        const list = document.createElement(tag);
        const start = tag === "ol" ? parseInt(item[2], 10) : 1;
        if (start !== 1) list.start = start;
        (lists.at(-1)?.item ?? content).append(list);
        lists.push({ indent, list, item: null });
      }
      const level = lists.at(-1);
      level.item = document.createElement("li");
      appendReplyInline(level.item, item[3]);
      level.list.append(level.item);
      continue;
    }
    const level = lists.at(-1);
    if (level && line.search(/\S/) > level.indent) {
      level.item.append("\n");
      appendReplyInline(level.item, line.trimStart());
    } else {
      lists.length = 0;
      paragraph.push(line);
    }
  }
  flushParagraph();
  body.classList.add("rich-reply");
  body.replaceChildren(content);
}

const $ = (id) => document.getElementById(id);
const log = $("log"), messages = $("msgs"), input = $("input"), form = $("form");
const send = $("send"), stop = $("stop"), key = $("key"), reconnect = $("reconnect");
const settings = $("settings"), budget = $("maxTokens"), effort = $("effort");
const canSendKey = location.protocol === "https:" || (
  location.protocol === "http:" &&
  (["localhost", "[::1]"].includes(location.hostname) || /^127(?:\.\d{1,3}){3}$/.test(location.hostname))
);
let turns = [], active = null, undo = null, issue = null, latestReply = null;
let identity = null, connection = "checking", modelCheck = 0, draftEdited = false;
let modelContext = null, concealed = null, reconnectForModel = false;
let authSaved = true, chatDirty = false, draftDirty = false, unloadWarning = false;

// Accepted credentials and chat state have independent storage records.
function read(keyName) {
  try { return sessionStorage.getItem(keyName) || ""; } catch { return ""; }
}

function save(keyName, value) {
  try {
    if (value) sessionStorage.setItem(keyName, value);
    else sessionStorage.removeItem(keyName);
    return true;
  } catch { return false; }
}

function readJSON(keyName) {
  try { return JSON.parse(read(keyName)); } catch { return null; }
}

let saved = readJSON("lamq-chat-v1");
let savedDraft = readJSON("lamq-draft-v1");
let accepted = canSendKey ? readJSON("lamq-key-v1") : null;
if (canSendKey) key.value = accepted?.key || read("lamq-key");

function sameIdentity(a, b) {
  return a?.model === b.model && a?.auth === b.auth;
}

function warnBeforeUnload(event) {
  event.preventDefault();
  event.returnValue = true;
}

function updateUnloadWarning() {
  const needed = chatDirty || draftDirty;
  if (needed === unloadWarning) return;
  if (needed) window.addEventListener("beforeunload", warnBeforeUnload);
  else window.removeEventListener("beforeunload", warnBeforeUnload);
  unloadWarning = needed;
}

function saveChat() {
  if (!identity) return;
  const settled = active ? turns.slice(0, -1) : turns;
  const pending = active ? active.draft : null;
  const saved = save("lamq-chat-v1", JSON.stringify({ identity, turns: settled, pending, undo, issue }));
  chatDirty = !(saved && authSaved) && Boolean(turns.length || undo || issue);
  updateUnloadWarning();
}

function saveDraft() {
  const text = concealed?.draft ?? input.value;
  const saved = (identity || !savedDraft?.identity) &&
    save("lamq-draft-v1", JSON.stringify({ identity, text, reconnectForModel }));
  draftDirty = !(saved && authSaved) && Boolean(text);
  updateUnloadWarning();
}

function element(tag, className, text = "") {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  return node;
}

function button(text, action) {
  const node = element("button", "turn-action", text);
  node.type = "button";
  node.addEventListener("click", action);
  return node;
}

function announce(text) {
  $("announcer").replaceChildren(document.createTextNode(text));
}

// Only move the transcript if the reader was already following the end.
function updateLog(change) {
  const follow = log.scrollHeight - log.clientHeight - log.scrollTop < 32;
  change();
  if (follow) log.scrollTop = log.scrollHeight;
}

function resizeInput() {
  input.style.height = "";
  if (input.value) input.style.height = Math.min(input.scrollHeight, 144) + "px";
}

function setDraft(text) {
  input.value = text;
  resizeInput();
}

function validBudget() {
  const valid = budget.validity.valid &&
    (budget.value === "" || Number.isSafeInteger(budget.valueAsNumber));
  const error = $("budgetError");
  error.hidden = valid;
  error.textContent = valid ? "" : "Enter a positive whole number, or leave Max tokens blank.";
  if (valid) budget.removeAttribute("aria-invalid");
  else budget.setAttribute("aria-invalid", "true");
  return valid;
}

function updateControls() {
  const busy = active !== null;
  send.hidden = busy;
  stop.hidden = !busy;
  send.disabled = busy || connection !== "ready" || !input.value.trim();
  input.readOnly = busy || concealed !== null;
  $("empty").hidden = connection !== "ready" || turns.length !== 0;
  log.tabIndex = messages.firstElementChild ? 0 : -1;
  $("clear").disabled = identity === null || concealed !== null;
  $("undo").hidden = undo === null || busy || concealed !== null;
  $("readReply").hidden = latestReply === null;
}

function setConnection(state, message, showKey = false) {
  connection = state;
  $("gate").hidden = state === "ready";
  $("gateMessage").textContent = message;
  $("keyLabel").hidden = !showKey;
  reconnect.hidden = state === "ready" || (state === "key" && !canSendKey) ||
    (state === "checking" && reconnect.hidden);
  reconnect.setAttribute("aria-disabled", String(state === "checking"));
  if (state !== "checking") reconnect.textContent = showKey ? "Connect" : "Reconnect";
  const status = $("status");
  status.textContent = state === "ready" ? message : "";
  status.title = status.textContent;
  if (state !== "ready") $("contextInfo").textContent = "";
  updateControls();
}

function requireKey(attempted) {
  if (identity?.auth && !concealed) {
    concealed = { draft: input.value, scroll: log.scrollTop };
    messages.replaceChildren();
    latestReply = null;
    setDraft("");
    paintIssue();
  }
  const note = attempted ? "API key rejected. Enter a key to connect." : "Enter your API key to connect.";
  setConnection("key", canSendKey ? note : "Use HTTPS to connect with an API key.", canSendKey);
}

function headers(authKey = canSendKey ? key.value.trim() : "") {
  const result = { "Content-Type": "application/json" };
  if (authKey) result.Authorization = "Bearer " + authKey;
  return result;
}

function acceptModel(model, authKey) {
  if (authKey && (accepted?.key !== authKey || typeof accepted.scope !== "string")) {
    const scope = crypto.getRandomValues(new Uint32Array(4)).join("-");
    accepted = { key: authKey, scope };
  }
  if (authKey) {
    const credential = JSON.stringify(accepted);
    authSaved = save("lamq-key-v1", credential) || read("lamq-key-v1") === credential;
  }
  else {
    accepted = null;
    authSaved = true;
    save("lamq-key-v1", "");
  }
  save("lamq-key", "");
  const priorIdentity = identity;
  identity = { model: model.id, auth: authKey ? accepted.scope : "" };
  const gateWasFocused = [key, reconnect].includes(document.activeElement);
  modelContext = Number.isSafeInteger(model.context_length) && model.context_length > 0 ? model.context_length : null;
  if (priorIdentity && !sameIdentity(priorIdentity, identity)) {
    const draft = reconnectForModel && priorIdentity.auth === identity.auth ? (concealed?.draft ?? input.value) : "";
    concealed = null;
    turns = [];
    undo = null;
    setDraft(draft);
    setIssue(null);
    drawTurns();
  } else if (concealed) {
    const { draft, scroll } = concealed;
    concealed = null;
    setDraft(draft);
    drawTurns();
    paintIssue();
    log.scrollTop = scroll;
  }
  reconnectForModel = false;
  setConnection("ready", model.id);
  const context = modelContext === null ? "" : " · " + modelContext.toLocaleString() + " context tokens";
  $("contextInfo").textContent = model.id + context;
  if (!priorIdentity) restoreChat();
  saveChat();
  saveDraft();
  if (gateWasFocused) input.focus({ preventScroll: true });
}

async function checkModel() {
  const check = ++modelCheck;
  const authKey = canSendKey ? key.value.trim() : "";
  const showKey = !$("keyLabel").hidden;
  setConnection("checking", "Connecting to the model…", showKey);
  try {
    const response = await fetch("/v1/models", {
      headers: headers(authKey), mode: "same-origin", redirect: "error", cache: "no-store",
    });
    if (check !== modelCheck) return;
    if (response.status === 401) {
      requireKey(authKey);
      return;
    }
    if (!response.ok) throw new Error("Could not connect");
    const model = (await response.json()).data?.[0];
    if (check !== modelCheck) return;
    if (typeof model?.id === "string" && model.id) acceptModel(model, authKey);
    else setConnection("offline", "No model is available. Reconnect when the model is running.", showKey);
  } catch {
    if (check === modelCheck) setConnection("offline", "Could not connect to the model. Try reconnecting.", showKey);
  }
}

function openBudget() {
  settings.open = true;
  budget.focus({ preventScroll: true });
}

function description(turn) {
  switch (turn.state) {
    case "waiting": return turn.reasoning ? "Preparing the reply…" : "Waiting for the model…";
    case "limit": {
      const opening = turn.answer.trim() ? "Partial reply. " : "The model reached a limit before replying. ";
      return opening + (turn.contextLimit
        ? "The chat filled the context. Shorten your message or start fresh."
        : "Increase Max tokens or lower Reasoning, then send again.");
    }
    case "stopped": return "Reply stopped. Send again to retry.";
    case "reloaded": return "Page reloaded before the reply finished. Send again to retry.";
    case "empty": return "The model sent no reply. Send again to retry.";
    case "interrupted": return turn.error || "Connection ended before the reply finished. Send again to retry.";
    default: return "";
  }
}

function recordReply(turn) {
  const prompt = element("article", "msg user", turn.prompt);
  prompt.setAttribute("aria-label", "You");
  const reply = element("article", "msg assistant");
  reply.setAttribute("aria-label", "Assistant");
  reply.tabIndex = -1;
  const think = element("details", "think");
  const reasoning = element("div", "reasoning-text");
  think.append(element("summary", "", "Reasoning"), reasoning);
  const body = element("div", "body");
  const notice = element("div", "notice");
  const stats = element("details", "stats");
  const statsValue = element("div", "stats-value");
  stats.append(element("summary", "", "Usage"), statsValue);
  reply.append(think, body, notice, stats);
  messages.append(prompt, reply);
  const view = { prompt, reply, think, reasoning, body, notice, stats, statsValue };
  if (turn.state === "waiting") paintProgress(turn, view);
  else paintSettled(turn, view);
  return view;
}

function paintProgress(turn, view) {
  view.think.hidden = !turn.reasoning;
  view.reasoning.textContent = turn.reasoning;
  view.reply.classList.toggle("streaming", turn.state === "waiting");
  view.body.hidden = !turn.answer;
  view.body.textContent = turn.answer;
  view.notice.hidden = !!turn.answer;
  view.notice.textContent = description(turn);
  view.stats.hidden = true;
}

function paintSettled(turn, view) {
  paintProgress(turn, view);
  if (turn.answer) {
    renderReply(view.body, turn.answer);
    latestReply = view.reply;
  }
  const note = description(turn);
  view.notice.hidden = !note;
  if (turn.state === "limit") {
    if (turn.contextLimit && turns.some(previous => previous.state === "complete")) {
      view.notice.append(" ", button("Start fresh with draft", () => startNewChat(true)));
    } else if (!turn.contextLimit) {
      view.notice.append(" ", button("Adjust generation settings", openBudget));
    }
  }
  if (note) view.notice.append(element("div", "", "Later replies use only finished turns."));
  view.reply.classList.toggle("partial", !!note && !!turn.answer.trim());
  view.reply.classList.toggle("error", turn.state === "interrupted" || turn.state === "empty");
  view.statsValue.textContent = turn.usage || "";
  view.stats.hidden = !turn.usage;
}

function drawTurns() {
  messages.replaceChildren();
  latestReply = null;
  for (const turn of turns) recordReply(turn);
  updateControls();
}

function restoreChat() {
  const draftIdentity = savedDraft?.identity;
  const migrateDraft = savedDraft?.reconnectForModel && draftIdentity?.auth === identity.auth;
  if (!draftEdited && (!draftIdentity || sameIdentity(draftIdentity, identity) || migrateDraft)) {
    setDraft(savedDraft?.text || "");
  }
  if (sameIdentity(saved?.identity, identity)) {
    turns = Array.isArray(saved.turns) ? saved.turns : [];
    undo = draftEdited ? null : saved.undo || null;
    issue = draftEdited ? null : saved.issue || null;
    if (saved.pending) {
      turns.push({ prompt: saved.pending.trim(), answer: "", reasoning: "", state: "reloaded" });
      if (!draftEdited) setDraft(saved.pending);
    }
    drawTurns();
    log.scrollTop = log.scrollHeight;
    paintIssue();
  }
  saved = savedDraft = null;
  updateControls();
}

function paintIssue() {
  const box = $("sendError");
  box.replaceChildren();
  box.hidden = issue === null || concealed !== null;
  if (box.hidden) return;
  box.append(document.createTextNode(issue.message));
  if (issue.context && turns.some(turn => turn.state === "complete")) {
    box.append(" ", button("Start fresh with draft", () => startNewChat(true)));
  }
}

function setIssue(next) {
  issue = next;
  paintIssue();
}

function usageText(reply) {
  const parts = [];
  const { started, first, last, usage } = reply;
  if (first !== null) parts.push("First output in " + ((first - started) / 1000).toFixed(2) + " s");
  if (Number.isSafeInteger(usage?.completion_tokens) && usage.completion_tokens >= 0) {
    parts.push(usage.completion_tokens.toLocaleString() + " output tokens");
    const interval = (last - first) / 1000;
    if (first !== null && interval >= 0.1 && usage.completion_tokens > 1) {
      const rate = (usage.completion_tokens - 1) / interval;
      parts.push("About " + rate.toFixed(1) + " tok/s observed");
    }
  }
  if (Number.isSafeInteger(usage?.prompt_tokens) && usage.prompt_tokens >= 0) {
    const cached = usage.prompt_tokens_details?.cached_tokens;
    const count = usage.prompt_tokens.toLocaleString() + " prompt tokens";
    parts.push(Number.isSafeInteger(cached) && cached > 0 && cached <= usage.prompt_tokens
      ? count + " (" + cached.toLocaleString() + " cached)" : count);
  }
  parts.push(((performance.now() - started) / 1000).toFixed(1) + " s total");
  return parts.join(" · ");
}

function completedState(turn, reason) {
  if (reason === "length") return "limit";
  if (reason !== "stop") return "interrupted";
  return turn.answer.trim() ? "complete" : "empty";
}

function settle(reply, state, error = "") {
  if (active !== reply) return;
  const stopWasFocused = document.activeElement === stop;
  active = null;
  cancelAnimationFrame(reply.frame);
  const { turn, view } = reply;
  turn.state = state;
  turn.error = error;
  turn.usage = usageText(reply);
  if (state === "limit" && modelContext !== null) {
    const usage = reply.usage;
    turn.contextLimit = Number.isSafeInteger(usage?.prompt_tokens) && Number.isSafeInteger(usage?.completion_tokens) &&
      usage.prompt_tokens + usage.completion_tokens >= modelContext;
  }
  updateLog(() => {
    paintSettled(turn, view);
    if (state !== "complete") setDraft(reply.draft);
    updateControls();
  });
  saveChat();
  saveDraft();
  announce(state === "complete" ? "Reply ready." : description(turn));
  if (stopWasFocused) input.focus({ preventScroll: true });
}

async function rejectRequest(reply, response) {
  let detail;
  try { detail = (await response.json()).error; } catch { /* The status still identifies the failure. */ }
  if (active !== reply) return;
  const focused = document.activeElement;
  active = null;
  turns.pop();
  const { prompt, reply: assistant } = reply.view;
  updateLog(() => { prompt.remove(); assistant.remove(); });
  setDraft(reply.draft);
  let nextIssue;
  let recovery = input;
  if (response.status === 401) {
    requireKey(key.value.trim());
    if (canSendKey) recovery = key;
  } else if (response.status === 409 && detail?.type === "model_changed") {
    reconnectForModel = true;
    setConnection("model-changed", "The server switched models. Reconnect to start a fresh chat with your draft.");
    recovery = reconnect;
  } else if (detail?.type === "exceed_context_size_error") {
    const counts = /prompt (\d+) tokens, context (\d+)/.exec(detail.message);
    const breakdown = counts ? " The request uses " + Number(counts[1]).toLocaleString() +
      " tokens and the model has room for " + Number(counts[2]).toLocaleString() + "." : "";
    nextIssue = { context: true, message: "This chat exceeds the context limit. Shorten your message." + breakdown };
  } else if (response.status === 413) {
    nextIssue = { message: "This message is too large. Shorten it and send again." };
  } else if (response.status === 429 || (response.status === 503 && detail?.type === "server_overloaded")) {
    nextIssue = { message: "The server is busy. Wait a moment, then send again." };
  } else if (response.status >= 500) {
    nextIssue = { message: "The server could not start the reply (HTTP " + response.status + "). Send again to retry." };
  } else {
    nextIssue = { message: "The server rejected the message (HTTP " + response.status + "). " +
      (detail?.message || "Review your message and settings.") };
  }
  setIssue(nextIssue || null);
  updateControls();
  saveChat();
  saveDraft();
  announce(nextIssue?.message || $("gateMessage").textContent);
  if (focused === stop || (focused === input && recovery !== input)) recovery.focus({ preventScroll: true });
}

function applyChunk(reply, event) {
  if (event.error) throw new Error("The server stopped generating the reply. Send again to retry.");
  if (event.usage) reply.usage = event.usage;
  for (const choice of event.choices || []) {
    if (choice.finish_reason) reply.reason = choice.finish_reason;
    const { content, reasoning_content: reasoning } = choice.delta || {};
    if (typeof content === "string") reply.turn.answer += content;
    if (typeof reasoning === "string") reply.turn.reasoning += reasoning;
    if (!content && !reasoning) continue;
    reply.last = performance.now();
    if (reply.first === null) reply.first = reply.last;
    if (reply.frame) continue;
    reply.frame = requestAnimationFrame(() => {
      reply.frame = 0;
      if (active === reply) updateLog(() => paintProgress(reply.turn, reply.view));
    });
  }
}

async function receive(reply, request) {
  let reader;
  try {
    const response = await fetch("/v1/chat/completions", {
      method: "POST", headers: headers(), body: JSON.stringify(request), signal: reply.abort.signal,
      mode: "same-origin", redirect: "error",
    });
    if (active !== reply) return;
    if (!response.ok) {
      await rejectRequest(reply, response);
      return;
    }
    if (!response.body || !response.headers.get("Content-Type")?.startsWith("text/event-stream")) {
      throw new Error("The server did not send a chat reply. Send again to retry.");
    }
    reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (active !== reply) return;
      if (done) {
        settle(reply, "interrupted");
        return;
      }
      buffer += decoder.decode(value, { stream: true });
      let end;
      while ((end = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, end).trim();
        buffer = buffer.slice(end + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") {
          settle(reply, completedState(reply.turn, reply.reason));
          return;
        }
        if (data) applyChunk(reply, JSON.parse(data));
      }
    }
  } catch (error) {
    if (active !== reply) return;
    if (!reader && error instanceof TypeError) {
      setConnection("offline", "Lost the connection to the model. Reconnect to send again.");
      settle(reply, "interrupted", "Could not reach the model. Reconnect to send again.");
    } else {
      const message = error instanceof SyntaxError || error instanceof TypeError ? "" : error.message;
      settle(reply, "interrupted", message);
    }
  } finally {
    if (reader) reader.cancel().catch(() => {});
  }
}

function conversationHistory() {
  return turns.filter(turn => turn.state === "complete").flatMap(turn => {
    const assistant = { role: "assistant", content: turn.answer };
    if (turn.reasoning) assistant.reasoning_content = turn.reasoning;
    return [{ role: "user", content: turn.prompt }, assistant];
  });
}

function startNewChat(keepDraft = false) {
  if (turns.length === 0 && !input.value && !issue) return;
  const draft = active ? active.draft : input.value;
  const before = active ? turns.slice(0, -1).concat({ ...active.turn, state: "stopped" }) : turns;
  undo = { turns: before, draft, issue, scroll: log.scrollTop };
  const old = active;
  active = null;
  if (old) {
    cancelAnimationFrame(old.frame);
    old.abort.abort();
  }
  turns = [];
  setDraft(keepDraft ? draft : "");
  setIssue(null);
  drawTurns();
  saveChat();
  saveDraft();
  input.focus({ preventScroll: true });
  announce("New chat. Undo is available.");
}

form.noValidate = true;
form.addEventListener("submit", (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text || active || connection !== "ready") return;
  if (!validBudget()) {
    openBudget();
    return;
  }

  const request = { model: identity.model, messages: [...conversationHistory(), { role: "user", content: text }],
    stream: true, stream_options: { include_usage: true } };
  if (effort.value) request.reasoning_effort = effort.value;
  if (budget.value) request.max_tokens = budget.valueAsNumber;

  const sendWasFocused = document.activeElement === send;
  const turn = { prompt: text, answer: "", reasoning: "", state: "waiting" };
  const draft = input.value;
  let view;
  updateLog(() => { view = recordReply(turn); });
  turns.push(turn);
  active = { abort: new AbortController(), turn, view, draft, started: performance.now(), first: null, frame: 0 };
  undo = null;
  setIssue(null);
  setDraft("");
  updateControls();
  saveChat();
  saveDraft();
  if (sendWasFocused) stop.focus({ preventScroll: true });
  receive(active, request);
});

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
    event.preventDefault();
    if (!send.disabled) form.requestSubmit();
  }
});
input.addEventListener("input", () => {
  draftEdited = true;
  resizeInput();
  if (undo || issue) {
    undo = null;
    setIssue(null);
    saveChat();
  }
  updateControls();
  saveDraft();
});
budget.addEventListener("input", validBudget);
stop.addEventListener("click", () => {
  const reply = active;
  if (reply) {
    reply.abort.abort();
    settle(reply, "stopped");
  }
});
$("clear").addEventListener("click", () => startNewChat());
$("undo").addEventListener("click", () => {
  if (!undo) return;
  turns = undo.turns;
  setDraft(undo.draft);
  setIssue(undo.issue);
  const position = undo.scroll;
  undo = null;
  drawTurns();
  log.scrollTop = position;
  saveChat();
  saveDraft();
  input.focus({ preventScroll: true });
  announce("Chat restored.");
});
$("readReply").addEventListener("click", (event) => {
  event.preventDefault();
  if (!latestReply) return;
  latestReply.scrollIntoView({ block: "start" });
  latestReply.focus({ preventScroll: true });
});
reconnect.addEventListener("click", () => {
  if (connection !== "checking") checkModel();
});
key.addEventListener("input", () => {
  ++modelCheck;
  setConnection("key", "Enter your API key to connect.", true);
});
key.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.isComposing && event.keyCode !== 229) {
    event.preventDefault();
    checkModel();
  }
